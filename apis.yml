aid: supplier
name: Supplier
description: >-
  Supplier.io is a supplier intelligence and supplier diversity platform for enterprise
  procurement teams. It pairs a database of 20M+ suppliers enriched from 450+ sources with
  spend analytics, diverse- and small-business spend reporting, Tier 2 reporting, supplier
  discovery and sourcing (Supplier Explorer), economic impact analysis, and Scope 3
  carbon/ESG analytics. Backed by Norwest Venture Partners, it serves Fortune 100
  procurement organizations. Its only public machine-accessible surface is a published
  Model Context Protocol (MCP) server (the Royal MCP WordPress plugin) at supplier.io;
  there is no documented public developer REST API.
